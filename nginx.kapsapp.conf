# Upstream definition with HTTP Keep-Alive connection pooling to Node.js
upstream kapsapp_backend {
    server 127.0.0.1:5000;
    keepalive 32; # Prevents TCP handshake overhead per request
}

# WebSocket Upgrade Connection Map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name kapsapp.online www.kapsapp.online 5.182.34.242;
    return 301 https://$host$request_uri;
}

# HTTPS Server Block (HTTP/2 Enabled)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kapsapp.online www.kapsapp.online;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/kapsapp.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kapsapp.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Performance & Payload Size
    client_max_body_size 50M;
    client_body_buffer_size 512k;

    # Gzip Compression on Nginx Layer
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    root /var/www/kapsapp/dist;
    index index.html;

    # 1. 1-Year Immutable Caching for Static Frontend Assets (Vite compiled)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|gif|ico|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 2. Uploads folder serving directly via Nginx (Bypasses Node.js overhead)
    location /uploads/ {
        alias /var/www/kapsapp/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri @node_fallback;
    }

    location @node_fallback {
        proxy_pass http://kapsapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Socket.IO Real-Time Engine (WebSocket & Long-Polling)
    location /socket.io/ {
        proxy_pass http://kapsapp_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 4. API & Application Reverse Proxy
    location / {
        proxy_pass http://kapsapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-Alive & Buffer optimizations
        proxy_buffers 8 32k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 128k;
    }
}
